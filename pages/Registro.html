<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M. - Crear cuenta</title>
    <link rel="stylesheet" href="../css/Registro.css">
</head>
<body>
    <a href="../index.html" title="Enlace a inicio">Regresar al inicio</a>
    <a href="IniciarSesion.html" title="Enlace a iniciar sesión">¿Ya tienes una cuenta? Inicia sesión</a>
    
    <h2 id="tituloRegistro" class="titulo-usuario">Registro de Usuario</h2>
    
    <form class="Registro" id="formRegistro" action="../php/registro.php" method="POST">
        <!-- SELECCIÓN PRINCIPAL DE TIPO DE USUARIO -->
        <div>
            <label for="tipoUsuario">Tipo de usuario</label>
            <select class="Registro-input" id="tipoUsuario" name="tipoUsuario" required>
                <option value="" disabled selected>Seleccione su tipo de usuario</option>
                <option value="paciente">Paciente</option>
                <option value="funcionario">Funcionario</option>
                <option value="chofer">Chofer</option>
            </select>
        </div>

        <!-- REGISTRO DE FUNCIONARIO -->
        <div id="seccionFuncionario" class="campo-oculto">
            <label for="cedula_func">Cédula de Identidad</label>
            <input class="Registro-input" type="text" id="cedula_func" name="cedula" placeholder="Ingrese cédula">

            <label for="nombre_func">Nombre</label>
            <input class="Registro-input" type="text" id="nombre_func" name="nombre" placeholder="Ingrese nombre">

            <label for="apellido">Apellido</label>
            <input class="Registro-input" type="text" id="apellido" name="apellido" placeholder="Ingrese apellido">

            <label for="usuario">Nombre de usuario</label>
            <input class="Registro-input" type="text" id="usuario" name="usuario" placeholder="Ingrese usuario">

            <label for="email_func">Email</label>
            <input class="Registro-input" type="email" id="email_func" name="email" placeholder="Ingrese correo">

            <label for="contrasenia_func">Contraseña</label>
            <input class="Registro-input" type="password" id="contrasenia_func" name="contrasenia" placeholder="Ingrese contraseña">

            <label for="cargo">Cargo</label>
            <select class="Registro-input" id="cargo" name="cargo">
                <option value="" disabled selected>Seleccione un cargo</option>
                <option value="Medicina general">Medicina General</option>
                <option value="Enfermero">Enfermero</option>
                <option value="Gerencia">Gerencia</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Operador logístico">Operador Logístico (Traslados)</option>
            </select>
            
            <input class="Registro_boton" type="submit" value="Registrarse">
        </div>

        <!-- REGISTRO DE PACIENTE -->
        <div id="seccionPaciente" class="campo-oculto">
            <label for="cedula_pac">Cédula de identidad</label>
            <input class="Registro-input" type="text" id="cedula_pac" name="cedula" placeholder="Ingrese cédula">

            <label for="nombre_pac">Nombre</label>
            <input class="Registro-input" type="text" id="nombre_pac" name="nombre" placeholder="Ingrese nombre">

            <label for="apellido_pac">Apellido</label>
            <input class="Registro-input" type="text" id="apellido_pac" name="apellido" placeholder="Ingrese apellido">

            <label for="telefono">Teléfono</label>
            <input class="Registro-input" type="tel" id="telefono" name="telefono" placeholder="Ingrese teléfono">

            <label for="email_pac">Email</label>
            <input class="Registro-input" type="email" id="email_pac" name="email" placeholder="Ingrese correo">

            <label for="contrasenia_pac">Contraseña</label>
            <input class="Registro-input" type="password" id="contrasenia_pac" name="contrasenia" placeholder="Ingrese contraseña">

            <input class="Registro_boton" type="submit" value="Registrarse">
        </div>

       <!-- REGISTRO DE CHOFER -->
        <div id="seccionChofer" class="campo-oculto">
            <label for="cedula_cho">Cédula de Identidad</label>
            <input class="Registro-input" type="text" id="cedula_cho" name="cedula" placeholder="Ingrese cédula">

            <label for="nombre_cho">Nombre</label>
            <input class="Registro-input" type="text" id="nombre_cho" name="nombre" placeholder="Ingrese nombre">

            <label for="apellido_cho">Apellido</label>
            <input class="Registro-input" type="text" id="apellido_cho" name="apellido" placeholder="Ingrese apellido">

            <label for="email_cho">Email</label>
            <input class="Registro-input" type="email" id="email_cho" name="email" placeholder="Ingrese correo">

            <label for="contrasenia_cho">Contraseña</label>
            <input class="Registro-input" type="password" id="contrasenia_cho" name="contrasenia" placeholder="Ingrese contraseña">

            <label for="disponibilidad">Disponibilidad inicial</label>
            <select class="Registro-input" id="disponibilidad" name="disponibilidad">
                <option value="Disponible">Disponible</option>
                <option value="No disponible">No Disponible / Fuera de Servicio</option>
            </select>

            <input class="Registro_boton" type="submit" value="Registrarse">
        </div>
    </form>

    <script src="../JavaScript/Registro.js"></script>
</body>
</html>
