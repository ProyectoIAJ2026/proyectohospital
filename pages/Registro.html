<!DOCTYPE html>
<head>
    <title>A.D.M.I.N. - Registarse</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <a href="../index.html" title="Enlace a inicio">Regresar al inicio</a>
    <a href="IniciarSesion.html" title="Enlace a iniciar sesion">¿Ya tienes una cuenta? Inicia sesión</a>
    <h2>Registro</h2>
    <form class ="Registro">
        <p>Nombre de usuario</p>
        <input class="Registro_input" type="text" placeholder="Nombre de usuario" required>
        <p>Email</p>
        <input class="Registro_input" type="email" placeholder="Email" required>
        <p>Contraseña</p>
        <input class="Registro_input" type="password" placeholder="Contraseña" required>
        <p>Fecha de Nacimiento</p>
        <input class="Registro_input" type="date" required>
        <p>Cedula de Identidad</p>
        <input class="Registro_input" type="cedula" placeholder="Cedula de Identidad" required>
        <p>Aceptas términos y condiciones</p>
        <input type="checkbox" required>
        <input class="Registro_input" type="submit" value="Registrarse">
    </form>

</body>
</html>
