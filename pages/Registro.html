<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>A.D.M.I.N. - Registrarse</title>
    <link rel="stylesheet" href="../css/Registro.css">
</head>
<body>
    <a href="../index.html" class="box-inicio" title="Enlace a inicio">Regresar al inicio</a>
    <a href="IniciarSesion.html" class="box-registro" title="Enlace a iniciar sesión">¿Ya tienes una cuenta? Inicia sesión</a>
    
    <h2>Registro de funcionario</h2>
    
    <form class="Registro" id="registro">
        <label for="cedula">Cédula de Identidad</label>
        <input class="Registro-input" type="text" id="cedula" name="cedula" placeholder="Ingrese cédula" required>

        <label for="nombre">Nombre</label>
        <input class="Registro-input" type="text" id="nombre" name="nombre" placeholder="Ingrese nombre" required>

        <label for="apellido">Apellido</label>
        <input class="Registro-input" type="text" id="apellido" name="apellido" placeholder="Ingrese apellido" required>

        <label for="usuario">Nombre de usuario</label>
        <input class="Registro-input" type="text" id="usuario" name="usuario" placeholder="Ingrese usuario" required>
        
        <label for="contrasenia">Contraseña</label>
        <input class="Registro-input" type="password" id="contrasenia" name="contrasenia" placeholder="Ingrese contraseña" required>

        <label for="rol">Rol</label>
        <select class="Registro-input" id="rol" name="rol" required>
            <option value="" disabled selected>Seleccione un rol</option>
            <option value="Medico">Medicina General</option>
            <option value="Enfermero">Enfermero</option>
            <option value="Administrador">Gerencia</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Chofer">Chofer</option>
        </select>
        
        <input class="Registro_boton" type="submit" value="Registrarse">
    </form>

</body>
</html>
