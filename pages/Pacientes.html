<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>A.D.M.I.N. - Pacientes</title>
    <link rel="stylesheet" href="../css/Pacientes.css">
</head>
<body>
    <a href="../index.html" title="Enlace a inicio">Regresar al inicio</a>
    <h2>Pacientes</h2>

    <div class="box">
        <h3>Buscar Paciente</h3>
        <form id="formBuscar">
            <label for="cedula">Cédula:</label>
            <input class="registro-input" type="text" id="cedula" name="cedula" placeholder="Ingrese cédula" required>
            <button type="submit">Buscar</button>
        </form>

        <!-- Contenedor donde se mostrarán los datos del paciente buscado -->
        <div id="resultadoBusqueda"></div>
    </div>

    <div class="box">
        <h3>Registrar Nuevo Paciente</h3>
        <form id="formRegistro">
            <label for="reg-cedula">Cédula:</label>
            <input class="registro-input" type="text" id="reg-cedula" name="cedula" placeholder="Ingrese cédula" required>

            <label for="reg-nombre">Nombre:</label>
            <input class="registro-input" type="text" id="reg-nombre" name="nombre" placeholder="Ingrese nombre completo" required>

            <label for="reg-telefono">Teléfono:</label>
            <input class="registro-input" type="tel" id="reg-telefono" name="telefono" placeholder="Ingrese teléfono" required>

            <label for="reg-email">Email:</label>
            <input class="registro-input" type="email" id="reg-email" name="email" placeholder="Ingrese email" required>

            <button type="submit">Guardar Paciente</button>
        </form>
    </div>

</body>
</html>
