<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M - Cargar Documento</title>
    <link rel="stylesheet" href="../css/Documentos.css">
</head>
<body>

    <h2>Cargar Documento</h2>

    <form class="box" id="formularioCarga" method="POST" enctype="multipart/form-data">
        <label for="titulo">Nombre del Documento (Título)</label>
        <input class="box-input" type="text" id="titulo" name="titulo" placeholder="Nombre de Documento" required>

        <label for="archivo_url">Subir Documento (Archivo)</label>
        <input class="box-input" type="file" id="archivo_url" name="archivo_url" required>

        <label for="descripcion">Descripción</label>
        <textarea class="box-input" id="descripcion" name="descripcion" placeholder="Descripción del documento" rows="3"></textarea>

        <label for="estado">Estado</label>
        <input class="box-input" type="text" id="estado" name="estado" placeholder="Estado del documento">

        <label for="fecha_carga">Ingresar Fecha de Carga</label>
        <input class="box-input" type="date" id="fecha_carga" name="fecha_carga" required>

        <label for="cedula">Cédula de Identidad (Paciente)</label>
        <input class="box-input" type="text" id="cedula" name="cedula" placeholder="Cédula del paciente">

        <label for="ci_funcionario">Cédula del Funcionario</label>
        <input class="box-input" type="text" id="ci_funcionario" name="ci_funcionario" placeholder="Cédula del funcionario" required>

        <button type="submit" id="subir" class="box-submit">Cargar Documento</button>
        <a href="../index.html" title="Enlace a inicio">Regresar al inicio</a>
    </form>

    <div id="mensaje"></div>

    <div class="box" id="obtener" style="text-align: center;">
        <button id="boton" class="box-submit" style="margin-top: 0;">Obtener Documentos</button>
        <select name="listaDoc" id="listaDoc" class="box-input">
            <option value="">Seleccione un documento...</option>
        </select>
    </div>

    <!-- Contenedor para mostrar la imagen del Código QR generado -->
    <div class="box" id="contenedorQR" style="display: none; text-align: center;">
        <p>Código QR del Documento:</p>
        <img id="imagenQR" src="" alt="Código QR del documento" style="width: 150px; height: 150px; border: 1px solid #ccc; padding: 5px; background: white; border-radius: 10px; margin-top: 10px;">
    </div>

    <!-- Vista previa -->
    <iframe id="previsualizacion" style="width: 100%; max-width: 450px; height: 400px; display: none; margin: 10px auto; border-radius: 15px; border: 5px solid rgb(0, 97, 177); box-sizing: border-box; display: block;"></iframe>
    
    <script src="../JavaScript/Documentos.js"></script>
</body>
</html>
