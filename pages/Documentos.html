<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Documento</title>
    <link rel="stylesheet" href="../css/Documentos.css">
</head>
<body>
    <header>
        <h1>Cargar Documento</h1>
    </header>

    <form class="SubidaDocumento" id="formularioCarga" enctype="multipart/form-data">
        <p>Nombre del Documento (Título)</p>
        <input class="Documento_input" type="text" id="titulo" name="titulo" placeholder="Nombre de Documento" required>

        <p>Subir Documento (Archivo)</p>
        <input class="Documento_input" type="file" id="archivo_url" name="archivo_url" required>

        <p>Descripción</p>
        <textarea class="Documento_input" id="descripcion" name="descripcion" placeholder="Descripción del documento" rows="3"></textarea>

        <p>Estado</p>
        <input class="Documento_input" type="text" id="estado" name="estado" placeholder="Estado del documento">

        <p>Ingresar Fecha de Carga</p>
        <input class="Documento_input" type="date" id="fecha_carga" name="fecha_carga" required>

        <p>Cédula de Identidad (Paciente)</p>
        <input class="Documento_input" type="text" id="cedula" name="cedula" placeholder="Cédula del paciente" required>

        <p>Cédula del Funcionario</p>
        <input class="Documento_input" type="text" id="ci_funcionario" name="ci_funcionario" placeholder="Cédula del funcionario" required>

        <input class="Documento_input" type="submit" id="subir" value="Cargar Documento">
        <a href="../index.html" title="Enlace a inicio">Regresar al inicio</a>
    </form>

    <div id="mensaje"></div>

    <section id="obtener">
        <button id="boton">Obtener Documentos</button>
        <select name="listaDoc" id="listaDoc">
            <option value="">Seleccione un documento...</option>
        </select>
    </section>

    <!-- Vista previa (opcional) -->
    <iframe id="previsualizacion" style="width: 100%; height: 400px; display: none; margin-top: 20px;"></iframe>

    <script src="../js/cargar.js"></script>
</body>
</html>
