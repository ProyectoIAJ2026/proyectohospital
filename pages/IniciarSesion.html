<!DOCTYPE html>

    <a href="Registro.html" class="box-registro" title="Enlace a registro">¿Aún no tienes cuenta? Regístrate</a>
    
    <h2>Iniciar Sesión</h2>
    
    <form class="IniciarSesion" id="formInicioSesion" action="../php/IniciarSesion.php" method="POST">
        <label for="cedula">Cédula, Usuario o Email</label>
        <input class="IniciarSesion-input" type="text" id="cedula" name="usuario" placeholder="Ingrese cédula, usuario o correo" required>
        
        <label for="password">Contraseña</label>
        <input class="IniciarSesion-input" type="password" id="password" name="contrasenia" placeholder="Ingrese contraseña" required>
        
        <input class="IniciarSesion-input IniciarSesion-submit" type="submit" value="Iniciar Sesión">
    </form>    

    <script src="../JavaScript/IniciarSesion.js"></script>
