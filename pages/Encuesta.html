<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>A.D.M.I.N. - Encuesta de Satisfacción</title>
    <link rel="stylesheet" href="../css/Encuesta.css">
</head>
<body>
    <a href="../index.html">Regresar al inicio</a>
    <h2>Encuesta de Satisfacción</h2>
    <div class="box">
        <p>Tu opinión nos ayuda a mejorar la atención.</p>

        <!-- Formulario configurado con método POST hacia el script PHP -->
        <form action="../php/Encuesta.php" method="POST">

            <!-- Email Opcional -->
            <label for="email">Email (Opcional):</label>
            <input type="email" id="email" name="email" class="box-input" placeholder="Ingrese email">

            <!-- Pregunta 1 -->
            <label for="atencion">1. ¿Cómo califica la atención recibida?</label>
            <select id="atencion" name="atencion" class="box-input" required>
                <option value="">Selecciona una opción</option>
                <option value="excelente">Excelente</option>
                <option value="buena">Buena</option>
                <option value="regular">Regular</option>
                <option value="mala">Mala</option>
            </select>

            <!-- Pregunta 2 -->
            <label>2. ¿El tiempo de espera fue adecuado?</label>
            <div class="radio">
                <label><input type="radio" name="tiempo" value="si" required> Sí</label>
                <label><input type="radio" name="tiempo" value="no"> No</label>
            </div>

            <!-- Pregunta 3 (Redacción mejorada) -->
            <label>3. ¿Cómo accedió a esta encuesta?</label>
            <div class="radio">
                <label><input type="radio" name="acceso" value="qr" required> Código QR impreso</label>
                <label><input type="radio" name="acceso" value="web"> Portal del sitio web</label>
            </div>

            <!-- Pregunta 4 -->
            <label for="comentarios">4. Comentarios o sugerencias:</label>
            <textarea id="comentarios" name="comentarios" class="box-input" rows="3" placeholder="Escribe aquí..." required></textarea>

            <!-- Botón de Envío -->
            <button type="submit" class="box-submit">Enviar Encuesta</button>
        </form>
    </div>

    <!-- Vincular el script JS antes de cerrar el body -->
    <script src="../js/Encuesta.js"></script>
</body>
</html>
